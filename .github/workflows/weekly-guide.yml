# 📁 /.github/workflows/weekly-guide.yml
#
# Publie automatiquement 1 guide SEO (FR) sur /guides/ chaque MARDI à 09:00 (heure de Paris).
# Rédaction par l'API Claude, assemblage dans le template du site, MAJ index + sitemap, puis push.
# Vercel redéploie automatiquement après le push.
#
# ⚠️ Prérequis — ajouter la clé API Anthropic en secret :
#    GitHub → Settings → Secrets and variables → Actions → New repository secret
#    Nom : ANTHROPIC_API_KEY   Valeur : ta clé (sk-ant-...)
#
# Sujets : gérés dans scripts/guides-queue.json (le script prend le 1er non publié).
# Test manuel : onglet Actions → "Guide SEO hebdomadaire" → Run workflow.

name: Guide SEO hebdomadaire

on:
  schedule:
    # GitHub cron est en UTC, et ne garantit PAS l'heure : les tâches planifiées
    # sont régulièrement différées de plusieurs heures en cas de charge.
    # On vise donc large, et c'est le garde-fou ci-dessous (un seul guide par
    # semaine) qui empêche les doublons — pas l'heure.
    - cron: "0 7 * * 2"    # visé : 09:00 Paris en été (CEST)
    - cron: "0 8 * * 2"    # visé : 09:00 Paris en hiver (CET)
    - cron: "0 13 * * 3"   # filet de sécurité : mercredi, si le mardi a été perdu
    # Rattrapage ponctuel (7 semaines perdues à cause du garde-fou horaire).
    # Ne se déclenche qu'à cette date : à supprimer ensuite sans risque.
    - cron: "0 8 25 9 *"   # vendredi 25 septembre 2026
  workflow_dispatch: {}    # bouton "Run workflow" pour publier / tester à la main

permissions:
  contents: write
  issues: write   # pour ouvrir un ticket d'alerte si plus rien ne se publie

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Le garde-fou a besoin de l'historique : on récupère le dépôt d'abord.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Garde — un seul guide par semaine
        id: guard
        run: |
          # ⚠️ Ne PAS se fier à l'heure d'exécution : GitHub décale les tâches
          # planifiées (jusqu'à 5 h observées), ce qui faisait échouer
          # silencieusement toutes les publications depuis septembre 2026.
          # On vérifie plutôt si un guide a déjà été publié cette semaine.
          # Fenêtre volontairement courte (2 jours) : elle suffit à empêcher les
          # doublons (les 2 crons du mardi, puis le filet du mercredi), tout en
          # laissant passer un cron de rattrapage place quelques jours plus tard.
          DEPUIS=$(TZ=Europe/Paris date -d "-2 days" +%Y-%m-%d)
          echo "Recherche d'un guide publié depuis le $DEPUIS (heure Paris : $(TZ=Europe/Paris date +%H)h)"
          DEJA=$(git log --since="$DEPUIS 00:00" --grep="guide hebdomadaire (auto" --format=%h | head -1)
          if [ -n "$DEJA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Guide déjà publié il y a moins de 2 jours ($DEJA) — on saute."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun guide récent — on publie."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Générer le guide
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-guide.mjs

      - name: Committer & pousser
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "Guides : nouveau guide hebdomadaire (auto, $(TZ=Europe/Paris date +%Y-%m-%d))"
            git push
          fi

      # Cette automatisation est restée muette 7 semaines : un workflow qui saute
      # est indistinguable d'un workflow qui réussit. La surveillance ci-dessous
      # rend le silence bruyant — ticket GitHub + échec du run (donc e-mail).
      - name: Alerte — aucun guide publié depuis 10 jours
        if: always() && steps.guard.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DERNIER=$(git log -1 --grep="guide hebdomadaire (auto" --format=%cI)
          if [ -z "$DERNIER" ]; then
            echo "Aucun guide dans l'historique — rien à surveiller."; exit 0
          fi
          AGE=$(( ( $(date +%s) - $(date -d "$DERNIER" +%s) ) / 86400 ))
          echo "Dernier guide publié le $DERNIER — il y a $AGE jour(s)."
          if [ "$AGE" -le 10 ]; then
            echo "Dans les clous (seuil : 10 jours)."; exit 0
          fi

          echo "::error::Aucun guide publié depuis $AGE jours."
          gh label create auto-blog --color B60205 --description "Publication automatique de guides" 2>/dev/null || true
          EXISTANT=$(gh issue list --label auto-blog --state open --json number -q '.[0].number' 2>/dev/null)
          if [ -n "$EXISTANT" ]; then
            gh issue comment "$EXISTANT" --body "Toujours rien publié : $AGE jours au $(TZ=Europe/Paris date +%Y-%m-%d)."
          else
            gh issue create \
              --title "Auto-blog : aucun guide publié depuis $AGE jours" \
              --label auto-blog \
              --body "$(printf '%s\n' \
                "La publication automatique de guides semble interrompue." \
                "" \
                "- Dernier guide : **$DERNIER** (il y a **$AGE jours**)" \
                "- Seuil d'alerte : 10 jours" \
                "" \
                "Pistes à vérifier :" \
                "1. Journal de ce run : l'étape « Générer le guide » a-t-elle tourné, ou le garde-fou a-t-il sauté ?" \
                "2. Le secret \\`ANTHROPIC_API_KEY\\` est-il toujours valide ?" \
                "3. Reste-t-il des sujets non publiés dans \\`scripts/guides-queue.json\\` ?" \
                "" \
                "Ce ticket se ferme tout seul dès qu'un guide repart.")"
          fi
          exit 1

      - name: Refermer l'alerte si tout est reparti
        if: always() && steps.guard.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DERNIER=$(git log -1 --grep="guide hebdomadaire (auto" --format=%cI)
          [ -z "$DERNIER" ] && exit 0
          AGE=$(( ( $(date +%s) - $(date -d "$DERNIER" +%s) ) / 86400 ))
          [ "$AGE" -gt 10 ] && exit 0
          for N in $(gh issue list --label auto-blog --state open --json number -q '.[].number' 2>/dev/null); do
            gh issue close "$N" --comment "Publication repartie : dernier guide il y a $AGE jour(s)."
          done
